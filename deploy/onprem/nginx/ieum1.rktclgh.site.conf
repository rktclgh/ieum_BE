# Isolated pre-cutover hostname. It never replaces ieum.rktclgh.site and shares
# the existing Cloudflare Origin wildcard certificate already installed on the
# target host.
server {
    listen 80;
    listen [::]:80;
    server_name ieum1.rktclgh.site;

    # Keep the pre-cutover hostname read-only, including requests that arrive
    # over HTTP before the HTTPS redirect is applied.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ieum1.rktclgh.site;

    ssl_certificate /etc/cloudflare/rktclgh.site.pem;
    ssl_certificate_key /etc/cloudflare/rktclgh.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Ieum-Release-ID "__IEUM_RELEASE_ID__" always;

    # Staging is for read-path verification only until the public-write
    # cutover is explicitly committed. GET/HEAD/OPTIONS continue through the
    # normal API, WebSocket, and SSE proxy locations below.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location ^~ /api/v1/internal/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location ^~ /swagger-ui/ {
        return 404;
    }

    location = /swagger-ui {
        return 404;
    }

    location = /swagger-ui.html {
        return 404;
    }

    location ^~ /v3/api-docs/ {
        return 404;
    }

    location = /v3/api-docs {
        return 404;
    }

    location = /v3/api-docs.yaml {
        return 404;
    }

    location ~ ^/ws(?:/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /api/v1/sse/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
