services:
  app-main:
    image: ${APP_MAIN_IMAGE_DIGEST}
    env_file:
      - /etc/ieum/app-main.env
    ports:
      - "127.0.0.1:18080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ieum:
      # Existing MinIO owns the `minio` alias on this external network.
      minio:
    restart: unless-stopped

  app-ai:
    image: ${APP_AI_IMAGE_DIGEST}
    env_file:
      - /etc/ieum/app-ai.env
    ports:
      - "127.0.0.1:18084:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ieum
    restart: unless-stopped

networks:
  ieum:
    external: true
    name: ieum
  minio:
    external: true
    name: ieum-minio
